<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <style>
    *{fill:none;stroke:#000;stroke-width:.55}.cut{stroke-width:1}.guide{stroke:#777;stroke-dasharray:4 3}.wire{stroke:#17798e;stroke-width:1}.danger{fill:#ffe0e0;stroke:#b51f2e}.label{fill:#000;stroke:none;font:4px sans-serif}.title{font-size:6px;font-weight:700}.small{font-size:3.4px}
  </style>
  <text class="label title" x="10" y="12">ATLAS ARC BOW — RISER / HALL SENSOR REFERENCE (A4 LANDSCAPE)</text>
  <text class="label small" x="10" y="19">Reference only. Verify the exact ESP32, connector and Hall sensor before cutting final EVA.</text>
