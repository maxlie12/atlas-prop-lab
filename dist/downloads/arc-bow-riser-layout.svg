  <path class="guide" d="M125 60H268"/>
  <rect class="guide" x="145" y="52" width="44" height="16" rx="4"/>
  <rect class="cut" x="205" y="50" width="9" height="20" rx="3"/>
  <circle class="cut" cx="232" cy="60" r="5"/>
  <path class="wire" d="M214 60H227"/>
  <path d="M214 45V75M232 45V75"/>
  <text class="label small" x="202" y="39">8–25 mm CALIBRATION GAP</text>
