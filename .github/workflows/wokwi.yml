name: Simulate Spell Orb in Wokwi

on:
  push:
    paths:
      - "firmware/**"
      - "wokwi/**"
      - "wokwi.toml"
      - ".github/workflows/wokwi.yml"
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run --project-dir firmware/spell-orb
      - name: Run button scenario
        if: ${{ env.WOKWI_CLI_TOKEN != '' }}
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: /
          timeout: 12000
          scenario: wokwi/scenarios/cast-and-special.yaml
          expect_text: '"action":"SPECIAL"'

