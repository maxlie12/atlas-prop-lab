name: Arc Bow bench evidence validator
on:
  push:
    branches:
      - feat/bench-evidence-cli-20261102
  workflow_dispatch:
jobs:
  evidence-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Self-test evidence checker
        run: node scripts/check-bench-evidence.mjs --self-test
      - name: Validate Atlas repo contracts
        run: node scripts/validate-project.mjs
