name: Validate web and design files

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript
        run: node --check dist/app.js
      - name: Check project consistency
        run: node scripts/validate-project.mjs

